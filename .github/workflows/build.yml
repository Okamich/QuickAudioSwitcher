name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Build Solution
      run: dotnet build QuickAudioSwitcher.sln -c Release

    - name: Publish Monolithic Standalone (.exe)
      run: dotnet publish QuickAudioSwitcher/QuickAudioSwitcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o release-artifacts/standalone

    - name: Prepare Standalone Executable
      shell: pwsh
      run: |
        Move-Item "release-artifacts/standalone/QuickAudioSwitcher.exe" "release-artifacts/QuickAudioSwitcher.exe"

    - name: Publish Lightweight (.exe)
      run: dotnet publish QuickAudioSwitcher/QuickAudioSwitcher.csproj -c Release -r win-x64 --no-self-contained -p:PublishSingleFile=true -o release-artifacts/light

    - name: Prepare Lightweight Executable
      shell: pwsh
      run: |
        Move-Item "release-artifacts/light/QuickAudioSwitcher.exe" "release-artifacts/QuickAudioSwitcher-Light.exe"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: QuickAudioSwitcher-Windows-x64
        path: release-artifacts/

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release-artifacts/QuickAudioSwitcher.exe
          release-artifacts/QuickAudioSwitcher-Light.exe
        name: QuickAudioSwitcher ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
