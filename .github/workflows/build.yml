name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Build Solution
      run: dotnet build QuickAudioSwitcher.sln -c Release

    - name: Publish Framework-Dependent
      run: dotnet publish QuickAudioSwitcher/QuickAudioSwitcher.csproj -c Release -r win-x64 --no-self-contained -p:PublishSingleFile=true -o publish/framework-dependent

    - name: Publish Self-Contained
      run: dotnet publish QuickAudioSwitcher/QuickAudioSwitcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/self-contained

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: QuickAudioSwitcher-Windows-x64
        path: publish/
